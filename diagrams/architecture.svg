<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ab4f8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#81c995"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f28b82"/>
    </marker>
  </defs>

  <rect width="1240" height="820" fill="#0d1117"/>
  <text x="40" y="48" fill="#e6edf3" font-size="26" font-weight="bold">Ghana EMS — System Architecture</text>
  <text x="40" y="76" fill="#9da7b3" font-size="14">One node fleet, no cloud. Every arrow works with the internet down.</text>

  <!-- ================= AMBULANCE ================= -->
  <rect x="40" y="110" width="470" height="560" rx="14" fill="#161b22" stroke="#f0b429" stroke-width="2"/>
  <text x="60" y="142" fill="#f0b429" font-size="17" font-weight="bold">AMBULANCE  (one node set per vehicle)</text>

  <!-- Monitor -->
  <rect x="70" y="165" width="180" height="70" rx="8" fill="#1f2733" stroke="#8ab4f8"/>
  <text x="160" y="195" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="bold">Patient Monitor</text>
  <text x="160" y="216" fill="#9da7b3" font-size="11" text-anchor="middle">Mindray / Philips / generic</text>

  <!-- Node A -->
  <rect x="70" y="285" width="410" height="110" rx="8" fill="#1f2733" stroke="#f0b429" stroke-width="2"/>
  <text x="90" y="312" fill="#f0b429" font-size="15" font-weight="bold">NODE A — Sensor Tap (sealed box)</text>
  <text x="90" y="335" fill="#c9d1d9" font-size="12">• Taps monitor (BLE / serial), records to own storage</text>
  <text x="90" y="355" fill="#c9d1d9" font-size="12">• Append-only vitals log — survives tablet loss/reboot</text>
  <text x="90" y="375" fill="#c9d1d9" font-size="12">• On-device AI: rhythm · sepsis · trauma (&lt;300 ms)</text>

  <!-- Node B -->
  <rect x="70" y="445" width="410" height="200" rx="8" fill="#1f2733" stroke="#8ab4f8" stroke-width="2"/>
  <text x="90" y="472" fill="#8ab4f8" font-size="15" font-weight="bold">NODE B — Crew Tablet</text>

  <rect x="90" y="488" width="180" height="135" rx="6" fill="#16202c" stroke="#81c995"/>
  <text x="180" y="510" fill="#81c995" font-size="13" text-anchor="middle" font-weight="bold">C — Routing</text>
  <text x="180" y="532" fill="#c9d1d9" font-size="11" text-anchor="middle">picks hospital by:</text>
  <text x="180" y="550" fill="#c9d1d9" font-size="11" text-anchor="middle">doctor on shift · facilities</text>
  <text x="180" y="568" fill="#c9d1d9" font-size="11" text-anchor="middle">beds · drive time</text>
  <text x="180" y="590" fill="#f28b82" font-size="11" text-anchor="middle" font-weight="bold">gate: packet accepted</text>

  <rect x="290" y="488" width="180" height="135" rx="6" fill="#16202c" stroke="#f28b82"/>
  <text x="380" y="510" fill="#f28b82" font-size="13" text-anchor="middle" font-weight="bold">D — Trust Layer</text>
  <text x="380" y="532" fill="#c9d1d9" font-size="11" text-anchor="middle">signs every record</text>
  <text x="380" y="550" fill="#c9d1d9" font-size="11" text-anchor="middle">enforces signed protocols</text>
  <text x="380" y="568" fill="#c9d1d9" font-size="11" text-anchor="middle">hash chain + peers verify</text>
  <text x="380" y="590" fill="#c9d1d9" font-size="11" text-anchor="middle">field vitals win</text>

  <!-- Ambulance internal arrows -->
  <line x1="160" y1="235" x2="160" y2="285" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="172" y="264" fill="#8ab4f8" font-size="11">vitals stream</text>
  <line x1="275" y1="340" x2="275" y2="340" stroke="none"/>
  <line x1="180" y1="395" x2="180" y2="445" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="205" y1="445" x2="205" y2="395" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="216" y="424" fill="#9da7b3" font-size="11">alerts + display (Wi-Fi Direct)</text>

  <!-- ================= MESH ================= -->
  <ellipse cx="640" cy="330" rx="105" ry="85" fill="#14202e" stroke="#81c995" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="640" y="308" fill="#81c995" font-size="16" text-anchor="middle" font-weight="bold">MESH</text>
  <text x="640" y="330" fill="#c9d1d9" font-size="11" text-anchor="middle">LoRa 5–15 km</text>
  <text x="640" y="347" fill="#c9d1d9" font-size="11" text-anchor="middle">Wi-Fi 802.11s</text>
  <text x="640" y="364" fill="#c9d1d9" font-size="11" text-anchor="middle">LTE fallback</text>
  <text x="640" y="386" fill="#9da7b3" font-size="10" text-anchor="middle">store-and-forward</text>

  <line x1="510" y1="330" x2="535" y2="330" stroke="#81c995" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="535" y1="352" x2="510" y2="352" stroke="#81c995" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="522" y="318" fill="#9da7b3" font-size="10" text-anchor="middle">signed</text>

  <!-- ================= DISPATCH ================= -->
  <rect x="800" y="110" width="400" height="180" rx="12" fill="#161b22" stroke="#8ab4f8" stroke-width="2"/>
  <text x="820" y="142" fill="#8ab4f8" font-size="16" font-weight="bold">DISPATCH NODE (control room)</text>
  <text x="820" y="168" fill="#c9d1d9" font-size="12">• Fleet map + incident board (all units, live)</text>
  <text x="820" y="188" fill="#c9d1d9" font-size="12">• Backup replica of every record (CRDT sync)</text>
  <text x="820" y="208" fill="#c9d1d9" font-size="12">• Backup routing engine + logged overrides</text>
  <text x="820" y="228" fill="#c9d1d9" font-size="12">• Countersigns ambulance records</text>
  <text x="820" y="256" fill="#9da7b3" font-size="12">Thin client: any browser (React PWA)</text>

  <line x1="745" y1="240" x2="800" y2="215" stroke="#81c995" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="800" y1="245" x2="745" y2="270" stroke="#81c995" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- ================= HOSPITAL ================= -->
  <rect x="800" y="380" width="400" height="180" rx="12" fill="#161b22" stroke="#81c995" stroke-width="2"/>
  <text x="820" y="412" fill="#81c995" font-size="16" font-weight="bold">HOSPITAL NODE (ED)</text>
  <text x="820" y="438" fill="#c9d1d9" font-size="12">• Receives patient packet BEFORE arrival</text>
  <text x="820" y="458" fill="#c9d1d9" font-size="12">• Publishes: beds free · doctor on shift · queue</text>
  <text x="820" y="478" fill="#c9d1d9" font-size="12">• Accept / Query / Refuse-with-reason</text>
  <text x="820" y="498" fill="#c9d1d9" font-size="12">• Countersigns handover record</text>
  <text x="820" y="526" fill="#9da7b3" font-size="12">Thin client: QR scanner + browser kiosk</text>

  <line x1="745" y1="400" x2="800" y2="425" stroke="#81c995" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="800" y1="455" x2="745" y2="430" stroke="#81c995" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="772" y="382" fill="#9da7b3" font-size="10" text-anchor="middle">status</text>

  <!-- ================= PEER AMBULANCE ================= -->
  <rect x="800" y="620" width="400" height="90" rx="12" fill="#161b22" stroke="#f0b429" stroke-dasharray="6 4"/>
  <text x="820" y="650" fill="#f0b429" font-size="14" font-weight="bold">PEER AMBULANCES (same node set)</text>
  <text x="820" y="674" fill="#c9d1d9" font-size="12">Countersign each other's records when in range —</text>
  <text x="820" y="694" fill="#c9d1d9" font-size="12">a forgery contradicts copies held by peers.</text>

  <line x1="640" y1="415" x2="640" y2="665" stroke="#81c995" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="640" y1="665" x2="800" y2="665" stroke="#81c995" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrG)"/>

  <!-- ================= HANDOVER QR (direct) ================= -->
  <path d="M 480 560 C 620 600, 700 540, 795 480" fill="none" stroke="#f28b82" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrR)"/>
  <text x="640" y="585" fill="#f28b82" font-size="11" text-anchor="middle">handover QR — encrypted, single-use, direct (not via mesh)</text>

  <!-- ================= LEGEND ================= -->
  <rect x="40" y="705" width="730" height="90" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="732" fill="#e6edf3" font-size="13" font-weight="bold">Legend</text>
  <line x1="60" y1="755" x2="95" y2="755" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="105" y="759" fill="#c9d1d9" font-size="12">local (in-vehicle)</text>
  <line x1="230" y1="755" x2="265" y2="755" stroke="#81c995" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="275" y="759" fill="#c9d1d9" font-size="12">mesh (signed records + status)</text>
  <line x1="490" y1="755" x2="525" y2="755" stroke="#f28b82" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="535" y="759" fill="#c9d1d9" font-size="12">direct handover (encrypted QR)</text>
  <text x="60" y="782" fill="#9da7b3" font-size="11">Every record: append-only · hash-chained · Ed25519 signed · countersigned by dispatch + peers</text>
</svg>
